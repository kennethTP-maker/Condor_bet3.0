name: NHL + eSoccer + eBasketball Radar - actualización

on:
  schedule:
    - cron: "17 10 * * *"        # 10:17 UTC (05:17 Este de EE. UU.): estadísticas tras terminar todos los partidos
    - cron: "47 * * * *"         # cada hora, todo el día: eSoccer/eBasketball juegan las 24 h; NHL porteros y precios
  workflow_dispatch: {}      # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]
    paths: ["nhl_dashboard/**", ".github/workflows/nhl-dashboard.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nhl-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos oficiales NHL y calcular tendencias
        run: python nhl_dashboard/fetch_nhl.py

      - name: Datos de eSoccer (Kalshi)
        run: python nhl_dashboard/fetch_esoccer.py

      - name: Datos de eBasketball (Kalshi)
        run: python nhl_dashboard/fetch_esoccer.py --sport ebasketball

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "nhl-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nhl_dashboard/site/data nhl_dashboard/cache
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "NHL Radar: datos $(date -u +%Y-%m-%d)"
            # main can move while this runs (merges, another run): rebase keeping the fresh data, retry
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
        continue-on-error: true   # never block the page deploy below

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nhl_dashboard/site

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Reintentar publicación si GitHub falló
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
